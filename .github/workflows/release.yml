name: release

# Publishes to npm on a version tag, tokenless.
#
# npm is configured as a trusted publisher for this package (npmjs.com ->
# ts-ast-mcp -> Settings -> Trusted Publisher: gclluch/ts-ast-mcp, release.yml),
# so the registry verifies this workflow's OIDC identity claim directly. There
# is no NPM_TOKEN in this repo or its secrets - which is why `id-token: write`
# below is load-bearing twice over: it mints both the publish credential and
# the provenance attestation.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation, and OIDC if the token is dropped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which has no OIDC support and would fall back to
      # looking for a token that does not exist. Trusted publishing landed in
      # npm 11.5.1.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # The tag is what a user sees; package.json is what npm records. A
      # mismatch publishes an immutable, wrongly-numbered release - npm does not
      # allow re-publishing a version any more than PyPI does.
      - name: tag matches the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          echo "tag=$tag declared=$declared"
          test "$tag" = "$declared" || { echo "::error::tag $tag != package.json version $declared"; exit 1; }

      - run: npm ci
      # Publishing untested code is the failure this job exists to prevent, so
      # the suite runs here too rather than trusting that CI was green on main.
      - run: npx tsc --noEmit
      - run: npm test

      # Last gate before the upload: install the actual tarball and speak to it,
      # so a `files`/`bin` mistake fails here instead of on a user's machine.
      - name: packaged server answers over stdio
        run: |
          npm pack --pack-destination /tmp
          npm install -g /tmp/ts-ast-mcp-*.tgz
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | ts-ast-mcp | grep -q '"serverInfo"'

      # No NODE_AUTH_TOKEN: the OIDC exchange is the credential.
      - run: npm publish --provenance --access public
